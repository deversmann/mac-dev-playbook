# code: language=ansible
---

run_msc_installs: true
configure_homebrew: true
run_brew_bundle: false
configure_zsh: true
configure_finder: true
configure_terminal: true
configure_streamdeck: true
configure_files: true
run_git_checkouts: false

zsh_custom: "~/.oh-my-zsh-custom"
zsh_theme: "dje"
zsh_plugins: "git git-prompt virtualenv"

msc_installs:
  - Cyberduck
  - GIMP
  - GitHubDesktop
  - GoogleDrive
  - GrandPerspective
  - Slack
  - TheUnarchiver
  - WindowsApp
  - Zoom.us

git_projects:
  - "https://github.com/deversmann/mac-dev-playbook"
  - "https://github.com/deversmann/homeinfra"
  - "https://github.com/deversmann/otp-gen"
  - "https://github.com/deversmann/damien-live"

finder_defaults:
  - domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: bool
    value: true
  - domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: true
  - domain: com.apple.finder
    key: ShowMountedServersOnDesktop
    type: bool
    value: true
  - domain: com.apple.finder
    key: ShowRemovableMediaOnDesktop
    type: bool
    value: true
  - domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: true
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
  - domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: true
  - domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
  - domain: com.apple.finder
    key: FXEnableExtensionChangeWarning
    type: bool
    value: false
  - domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: Nlsv
  - domain: NSGlobalDomain
    key: NSDocumentSaveNewDocumentsToCloud
    type: bool
    value: false
  - domain: com.apple.LaunchServices
    key: LSQuarantine
    type: bool
    value: false
  - domain: com.apple.finder
    key: ShowRecentTags
    type: bool
    value: false
  - domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: Pfhm
    
...

